<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <title>Result • UPI Scam Shield</title>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="title">Fraud Analysis Result</h1>
      <div class="row" style="margin-bottom:10px">
        <div class="meter"><div id="meterBar" class="meter-bar"></div></div>
      </div>
      <div class="row" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
        <div><div class="muted">Fraud Score</div><div id="score" style="font-weight:800;font-size:1.4rem">-</div></div>
        <div><div class="muted">Classification</div><div id="classText" class="pill">-</div></div>
        <div><div class="muted">Decision</div><div id="decision" style="font-weight:800">-</div></div>
        <div><div class="muted">Processing Time</div><div id="time" style="font-weight:800">-</div></div>
      </div>
      <div class="row" style="margin-top:16px">
        <div class="muted">Detected Indicators</div>
        <ul id="reasons" style="margin:0;padding-left:18px"></ul>
      </div>
      <div style="margin-top:16px">
        <a href="dashboard.html"><button>Return to Dashboard</button></a>
      </div>
    </div>
  </div>
  <script src="../js/result.js"></script>
</body>
</html>
